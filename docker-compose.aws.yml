# AWS credential chain for infrastructure monitoring — `make up-aws`.
#
# Mounts your local AWS config read-only into the worker, the only process that
# reads CloudWatch Logs, so no AWS access keys are ever typed into or stored by
# the app. Run `aws sso login --profile <p>` on the host when a session expires.
# In production, give the worker a task, pod or instance role instead; the same
# credential chain picks it up and this file is not needed.
#
# Reads stay limited to the log groups listed in MONITORING_AWS_LOG_GROUPS.
services:
  worker:
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-default}
    volumes:
      - ${AWS_CONFIG_DIR:-${HOME}/.aws}:/root/.aws:ro
